<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Shazia ❤️</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1, #ff9a9e);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
  }
  @keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  /* GIRTE HUE DIL */
  .heart {
    position: fixed;
    top: -10px;
    color: #ff4d6d;
    font-size: 20px;
    animation: fall 5s linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    to {transform: translateY(100vh) rotate(360deg); opacity: 0;}
  }

  .login-box, .birthday-page {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    max-width: 500px;
    margin: auto;
    position: relative;
    z-index: 1;
  }
  .birthday-page { display: none; }
  
  input {
    padding: 12px;
    width: 80%;
    border-radius: 10px;
    border: 2px solid #ff9a9e;
    margin: 10px 0;
    font-size: 16px;
  }
  button {
    padding: 12px 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
  }
  button:hover { 
    background: #e63950; 
    transform: scale(1.05);
  }
  
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
  }
  .gallery img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
  }
  .gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(255,77,109,0.4);
  }
  
  h1 { color: #ff4d6d; font-size: 28px; }
  #typewriter { font-size: 18px; color: #333; min-height: 50px; }
  #countdown { font-size: 20px; color: #ff4d6d; font-weight: bold; margin: 15px 0; }
</style>
</head>
<body>

<!-- GIRTE HUE DIL BANANE KE LIYE -->
<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = Math.random() * 3 + 2 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }
  setInterval(createHeart, 300);
</script>

<div class="login-box" id="login">
  <h1>🎉 Happy Birthday Shazia 🎉</h1>
  <p>Ye website sirf tumhare liye hai ❤️<br>Password daal kar open karo</p>
  <input type="password" id="password" placeholder="Password likho">
  <br>
  <button onclick="checkPassword()">Open karo</button>
  <p id="error" style="color:red;"></p>
</div>

<div class="birthday-page" id="birthday">
  <h1>Happy Birthday My Shazia! 👑</h1>
  
  <div id="countdown"></div>
  
  <div id="typewriter"></div>
  
  <h2>Our 5 Best Memories 📸</h2>
  <div class="gallery">
    <img src="pic1.jpg" alt="Memory 1">
    <img src="pic2.jpg" alt="Memory 2">
    <img src="pic3.jpg" alt="Memory 3">
    <img src="pic4.jpg" alt="Memory 4">
    <img src="pic5.jpg" alt="Memory 5" style="grid-column: span 2;">
  </div>

  <h2>Mera Message</h2>
  <p>Shazia, tum duniya ki sabse achi ho. I love you so much!  
  Allah tumhe hamesha khush rakhe. Ameen ❤️</p>
  
  <button onclick="playMusic()">🎵 Surprise Music</button>
  <audio id="song" src="song.mp3"></audio>
</div>

<script>
  const correctPassword = "shazia"; 

  // TYPEWRITER EFFECT
  const text = "Tum meri zindagi ki sabse khoobsurat gift ho...";
  let i = 0;
  function typeWriter() {
    if (i < text.length) {
      document.getElementById("typewriter").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, 70);
    }
  }

  // COUNTDOWN TIMER - YAHAN DATE CHANGE KARO
  const birthdayDate = new Date("Dec 25, 2026 00:00:00").getTime(); // Shazia ki birthday date yahan dalo
  function updateCountdown() {
    const now = new Date().getTime();
    const distance = birthdayDate - now;
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    if(distance > 0) {
      document.getElementById("countdown").innerHTML = "🎂 Birthday me sirf " + days + " din baqi! 🎂";
    } else {
      document.getElementById("countdown").innerHTML = "🎉 Aaj Shazia ka Birthday hai! 🎉";
    }
